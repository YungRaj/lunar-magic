name: Rust workspace

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            package_target: x86_64-pc-windows-msvc
          - os: macos-15
            package_target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile complete test suite
        run: cargo test --workspace --all-targets --no-run
      - name: Build every portable runtime binary
        run: cargo build --locked -p lm-native -p lm-cli -p lm-libretro
      - name: Verify portable bundle contains the live backend
        run: >-
          cargo run --locked -p lm-package --
          --bin-dir target/debug
          --output-dir target/portable-ci
          --target ${{ matrix.package_target }}
          --version ci
      - name: Compile Snes9x gameplay driver
        if: runner.os != 'Windows'
        shell: bash
        run: tools/build-snes9x-gameplay-driver.sh "$RUNNER_TEMP/lm-snes9x-gameplay-driver"
      - name: Run self-contained core tests
        run: cargo test -p lm-rom -p lm-codec -p lm-rats -p lm-snes

  live-backend-linux:
    name: Execute Linux live-backend runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated backend
        run: cargo build --locked -p lm-libretro
      - name: Build deterministic libretro platform core
        run: >-
          cc -std=c11 -Wall -Wextra -Werror -shared -fPIC
          tools/lm-libretro-platform-core.c
          -o target/debug/lm-libretro-platform-core.so
      - name: Exercise every advertised backend capability
        run: >-
          python3 tools/lm-libretro-platform-oracle.py
          --backend target/debug/lm-libretro
          --core target/debug/lm-libretro-platform-core.so

  intel-macos:
    name: Check Intel macOS GUI
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Check every Intel macOS target
        run: cargo check --workspace --all-targets --target x86_64-apple-darwin
