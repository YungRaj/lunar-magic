[workspace]
members = [
    "crates/lm-rom",
    "crates/lm-codec",
    "crates/lm-rats",
    "crates/lm-level",
    "crates/lm-graphics",
    "crates/lm-overworld",
    "crates/lm-project",
    "crates/lm-profile",
    "crates/lm-render",
    "crates/lm-oracle",
    "crates/lm-app",
    "crates/lm-cli",
    "crates/lm-native",
    "crates/lm-snes",
    "crates/lm-title",
    "crates/lm-package",
    "crates/lm-update",
    "crates/lm-windows",
    "crates/lm-libretro",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
